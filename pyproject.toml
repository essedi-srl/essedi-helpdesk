[project]
name = "essedi_helpdesk"
authors = [{ name = "Essedi Srl", email = "info@essedisrl.eu" }]
description = "Personalizzazioni Essedi per Frappe Helpdesk"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
helpdesk = ">=16.0.0,<17.0.0"
